```yaml
name: CI

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: email-agent

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: email-agent/requirements.txt

      - run: pip install -r requirements.txt

      - run: python -m pytest -v
```